{% extends 'base.html' %}

{% block title %}Login - Samana Builders ERP{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="logo">SB</div>
            <h2>Samana Builders</h2>
            <p>Real Estate Management System</p>
        </div>
        <div class="login-body">
            {% if form.errors %}
            <div class="alert alert-error">
                Invalid username or password. Please try again.
            </div>
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
                <button type="button" class="btn btn-secondary" onclick="alert('Contact administrator')">Forgot Password?</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
