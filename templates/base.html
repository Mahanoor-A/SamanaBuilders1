<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Samana Builders ERP{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; min-height: 100vh; }
        
        :root {
            --primary-dark: #1e3a5f;
            --primary: #2d5a87;
            --primary-light: #94b8d4;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --bg-light: #f0f4f8;
            --text-dark: #334155;
            --border: #e2e8f0;
        }
        
        /* Login Page */
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 100%; max-width: 420px; overflow: hidden; }
        .login-header { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); padding: 40px; text-align: center; color: white; }
        .login-header .logo { width: 80px; height: 80px; background: white; border-radius: 20px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--primary-dark); font-weight: bold; }
        .login-header h2 { font-size: 24px; margin-bottom: 8px; }
        .login-header p { color: var(--primary-light); font-size: 14px; }
        .login-body { padding: 40px; }
        
        /* Form Styles */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 14px; transition: all 0.3s; font-family: inherit; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45,90,135,0.1); }
        textarea.form-control { resize: vertical; min-height: 80px; }
        select.form-control { cursor: pointer; }
        .form-check { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .form-check-input { width: 18px; height: 18px; cursor: pointer; }
        .form-check-label { font-size: 14px; color: var(--text-dark); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-error { color: var(--accent-red); font-size: 12px; margin-top: 4px; }
        .form-hint { color: #64748b; font-size: 12px; margin-top: 4px; }
        
        /* Buttons */
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30,58,95,0.3); }
        .btn-success { background: var(--accent-green); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: var(--accent-amber); color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: var(--accent-red); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: var(--bg-light); color: var(--text-dark); border: 2px solid var(--border); }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-block { width: 100%; }
        
        /* Layout */
        .app-layout { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: linear-gradient(180deg, var(--primary-dark) 0%, #15293f 100%); color: white; padding: 24px 0; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar-brand { padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 24px; }
        .sidebar-brand h2 { font-size: 18px; margin-bottom: 4px; }
        .sidebar-brand p { font-size: 12px; color: var(--primary-light); }
        .nav-menu { list-style: none; }
        .nav-item { margin-bottom: 2px; }
        .nav-link { display: flex; align-items: center; padding: 12px 24px; color: rgba(255,255,255,0.7); text-decoration: none; transition: all 0.3s; font-size: 14px; }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: white; border-left: 3px solid var(--primary-light); }
        .nav-icon { width: 20px; margin-right: 12px; text-align: center; }
        .nav-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 16px 24px; }
        .nav-section { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.4); padding: 8px 24px; }
        
        /* Main Content */
        .main-content { flex: 1; margin-left: 260px; padding: 24px; }
        
        /* Header */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-header h1 { font-size: 24px; color: var(--text-dark); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        
        /* Cards */
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 24px; margin-bottom: 24px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-header h3 { font-size: 16px; color: var(--text-dark); }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-card .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 16px; }
        .stat-card .stat-value { font-size: 28px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
        .stat-card .stat-label { font-size: 14px; color: #64748b; }
        .stat-icon.blue { background: rgba(45,90,135,0.1); color: var(--primary); }
        .stat-icon.green { background: rgba(16,185,129,0.1); color: var(--accent-green); }
        .stat-icon.amber { background: rgba(245,158,11,0.1); color: var(--accent-amber); }
        .stat-icon.red { background: rgba(239,68,68,0.1); color: var(--accent-red); }
        
        /* Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-light); font-weight: 600; color: var(--text-dark); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { font-size: 14px; color: var(--text-dark); }
        tr:hover { background: var(--bg-light); }
        
        /* Badges */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-secondary { background: #e2e8f0; color: #475569; }
        
        /* Alerts */
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .alert-info { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 48px 24px; color: #64748b; }
        .empty-state p { margin-top: 8px; font-size: 14px; }
        
        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: white; border-radius: 12px; padding: 24px; max-width: 400px; width: 90%; }
        .modal h3 { margin-bottom: 12px; color: var(--text-dark); }
        .modal p { margin-bottom: 20px; color: #64748b; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; }
        
        /* Filters */
        .filters { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
        .filters .form-control { width: auto; min-width: 200px; }
        .search-box { position: relative; }
        .search-box input { padding-left: 40px; }
        .search-box::before { content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); }
        
        /* Utility */
        .mb-0 { margin-bottom: 0; }
        .mb-1 { margin-bottom: 8px; }
        .mb-2 { margin-bottom: 16px; }
        .mb-3 { margin-bottom: 24px; }
        .mt-2 { margin-top: 16px; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .text-muted { color: #64748b; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    
    {% if messages %}
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    
    <script>
        // Auto-hide alerts after 3 seconds
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var alerts = document.querySelectorAll('.alert');
                alerts.forEach(function(alert) {
                    alert.style.opacity = '0';
                    alert.style.transition = 'opacity 0.3s';
                    setTimeout(function() { alert.remove(); }, 300);
                });
            }, 3000);
        });
    </script>
</body>
</html>
